<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalator modele</title>
<link rel="icon" href="data:,">
<!-- Instalator: device model viewer (turntable, labelled grid, side-by-side compare with reference photos). -->
<style>
  :root { --ink: #1f262c; --sub: #66717a; --bg: #e3e6e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.25 -apple-system, "SF Pro Text", "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .lab { position: absolute; padding: 4px 8px; white-space: nowrap; font-size: 12px; }
  .lab b { font-weight: 650; }
  .lab span { color: var(--sub); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .lab.warn span { color: #b4561b; }
  .cell { position: absolute; border-right: 1px solid rgba(31, 38, 44, 0.07); border-bottom: 1px solid rgba(31, 38, 44, 0.07); }
  .ref { position: absolute; object-fit: contain; background: #fff; }
  .miss { position: absolute; display: flex; align-items: center; justify-content: center; color: var(--sub); background: #f4f5f6; }
  #info { position: absolute; left: 12px; bottom: 10px; color: var(--sub); font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MODEL_IDS, MODEL_INFO, buildDevice, buildStrip } from '../../src/models/devices.js';
import { setDeviceEnvMap } from '../../src/models/devices/mat.js';

window.addEventListener('error', (e) => { window.__error = String(e.message || e); });
window.addEventListener('unhandledrejection', (e) => { window.__error = String(e.reason && e.reason.stack || e.reason); });

const Q = new URLSearchParams(location.search);
const ui = document.getElementById('ui');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(W, H);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = +(Q.get('exp') || 1.1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
setDeviceEnvMap(env, +(Q.get('env') || 1));

function backdrop() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, Q.get('bg1') || '#eceef0');
  gr.addColorStop(1, Q.get('bg2') || '#cfd3d7');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const scene = new THREE.Scene();
scene.background = backdrop();
const hemi = new THREE.HemisphereLight('#f4f7fc', '#77746f', 1.15);
const key = new THREE.DirectionalLight('#fffaf3', 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
const rim = new THREE.DirectionalLight('#dfe8ff', 0.9);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ color: '#1d2329', opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(hemi, key, key.target, rim, floor);

const PRESENT = { ceiling: [Math.PI, 0, 0], socketE27: [0, 0, Math.PI], socketGU10: [0, 0, Math.PI] };
const ELEV = { ceiling: 48, din: 14, rack: 16, socketE27: 14, socketGU10: 24, strip: 40 };

function stageModel(id) {
  const info = MODEL_INFO[id] || { mount: 'surface' };
  const dev = Q.get('strip') && info.strip ? buildStrip(id, [[-0.4, 0, 0], [0.4, 0, 0], [0.4, 0, -0.3]].map((p) => new THREE.Vector3(...p)), { normal: [0, 1, 0], on: Q.get('on') === '1' }) : buildDevice(id, { on: Q.get('on') === '1' ? true : Q.get('on') === '0' ? false : (info.view && info.view.on) || undefined, color: Q.get('lc') ? '#' + Q.get('lc') : (info.view && info.view.lc) || undefined, rows: +(Q.get('rows') || 0) || undefined });
  const inner = new THREE.Group();
  inner.add(dev);
  const pr = info.view && info.view.flip === false ? null : PRESENT[info.mount];
  if (pr) inner.rotation.set(pr[0], pr[1], pr[2]);
  if (info.view && info.view.rx) inner.rotation.x += info.view.rx;
  inner.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(inner);
  const c = box.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -box.min.y, -c.z);
  const wrap = new THREE.Group();
  wrap.add(inner);
  wrap.userData = { id, info, dev };
  return wrap;
}

function frameCam(cam, obj, yawDeg, elDeg, pad = 1.08) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const el = THREE.MathUtils.degToRad(elDeg), yaw = THREE.MathUtils.degToRad(yawDeg);
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(el), Math.sin(el), Math.cos(yaw) * Math.cos(el));
  const pts = [];
  obj.traverse((m) => {
    if (!m.isMesh) return;
    const p = m.geometry.attributes.position;
    const step = Math.max(1, Math.floor(p.count / 6000));
    for (let i = 0; i < p.count; i += step) pts.push(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld));
  });
  const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const target = sph.center.clone();
  let dist = sph.radius / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2) * Math.min(1, cam.aspect));
  cam.up.set(0, 1, 0);
  const v = new THREE.Vector3();
  for (let it = 0; it < 5; it++) {
    cam.position.copy(target).addScaledVector(dir, dist);
    cam.lookAt(target);
    cam.near = Math.max(0.0005, dist - sph.radius * 2.5);
    cam.far = dist + sph.radius * 6;
    cam.updateMatrixWorld(true);
    cam.updateProjectionMatrix();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { v.copy(p).project(cam); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    target.addScaledVector(right, (x0 + x1) / 2 * dist * t * cam.aspect).addScaledVector(up, (y0 + y1) / 2 * dist * t);
    dist *= Math.max((x1 - x0) / 2, (y1 - y0) / 2) * pad;
  }
  cam.position.copy(target).addScaledVector(dir, dist);
  cam.lookAt(target);
  cam.near = Math.max(0.0005, dist - sph.radius * 2.5);
  cam.far = dist + sph.radius * 6;
  cam.updateProjectionMatrix();
  return { target, sph };
}

function lightFor(sph) {
  const r = Math.max(0.05, sph.radius);
  key.position.copy(sph.center).add(new THREE.Vector3(-1.1, 2.2, 1.6).multiplyScalar(r * 2));
  key.target.position.copy(sph.center);
  const sc = key.shadow.camera;
  sc.left = -r * 1.8; sc.right = r * 1.8; sc.top = r * 1.8; sc.bottom = -r * 1.8; sc.near = r * 0.5; sc.far = r * 10;
  sc.updateProjectionMatrix();
  key.shadow.normalBias = r * 0.004;
  rim.position.copy(sph.center).add(new THREE.Vector3(1.6, 1.2, -2.2).multiplyScalar(r * 2));
  floor.scale.setScalar(r * 30);
  floor.position.set(sph.center.x, 0, sph.center.z);
}

function stats(dev) {
  let meshes = 0;
  dev.traverse((m) => { if (m.isMesh) meshes += 1; });
  return { tris: dev.userData.tris || 0, meshes, size: dev.userData.size || [0, 0, 0] };
}

function limitFor(info) { return info.family === 'rack' || info.mount === 'rack' ? 4000 : info.bulb ? 400 : 2500; }

function addLabel(x, y, html, warn) {
  const d = document.createElement('div');
  d.className = 'lab' + (warn ? ' warn' : '');
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.innerHTML = html;
  ui.appendChild(d);
}

function renderCell(obj, rect, yaw, el) {
  scene.children.forEach((c) => { if (c.userData.id) c.visible = c === obj; });
  const cam = new THREE.PerspectiveCamera(Q.get('fov') ? +Q.get('fov') : 28, rect.w / rect.h, 0.01, 100);
  const { sph } = frameCam(cam, obj, yaw, el, rect.pad || 1.1);
  lightFor(sph);
  const y = H - rect.y - rect.h;
  renderer.setViewport(rect.x, y, rect.w, rect.h);
  renderer.setScissor(rect.x, y, rect.w, rect.h);
  renderer.setScissorTest(true);
  renderer.render(scene, cam);
}

function idList() {
  if (Q.get('ids')) return Q.get('ids').split(',');
  if (Q.get('family')) return MODEL_IDS.filter((id) => (MODEL_INFO[id] || {}).family === Q.get('family'));
  return MODEL_IDS;
}

function single(id) {
  const obj = stageModel(id);
  scene.add(obj);
  const info = obj.userData.info;
  const yaw0 = +(Q.get('yaw') ?? (info.view && info.view.yaw) ?? 28), el = +(Q.get('el') ?? (info.view && info.view.el) ?? ELEV[info.mount] ?? 20);
  const cam = new THREE.PerspectiveCamera(+(Q.get('fov') || 28), W / H, 0.01, 100);
  const { target, sph } = frameCam(cam, obj, yaw0, el, 1.12);
  lightFor(sph);
  if (Q.get('label') === '1') {
    const s = stats(obj.userData.dev);
    addLabel(10, 8, `<b>${id}</b><span>${s.tris} tris · ${s.meshes} meshes · ${s.size.map((v) => (v * 1000).toFixed(0)).join('×')} mm</span>`);
  }
  const controls = new OrbitControls(cam, renderer.domElement);
  controls.target.copy(target);
  controls.update();
  const spin = Q.get('spin') !== '0' && !Q.get('yaw');
  const draw = () => renderer.render(scene, cam);
  controls.addEventListener('change', draw);
  if (spin) {
    let last = performance.now();
    const loop = (t) => { obj.rotation.y += (t - last) * 0.00035; last = t; draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  draw();
}

function grid(ids) {
  const n = ids.length;
  const cols = +(Q.get('cols') || Math.ceil(Math.sqrt(n * W / H)));
  const rows = Math.ceil(n / cols);
  const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
  ids.forEach((id, i) => {
    const obj = stageModel(id);
    scene.add(obj);
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    const info = obj.userData.info;
    renderCell(obj, { x, y: y + 18, w: cw, h: ch - 18, pad: 1.12 }, +(Q.get('yaw') ?? (info.view && info.view.yaw) ?? 28), +(Q.get('el') ?? (info.view && info.view.el) ?? ELEV[info.mount] ?? 20));
    const s = stats(obj.userData.dev);
    const cell = document.createElement('div');
    cell.className = 'cell';
    Object.assign(cell.style, { left: x + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' });
    ui.appendChild(cell);
    if (Q.get('label') !== '0') addLabel(x, y, `<b>${id}</b><span>${s.tris} · ${s.meshes}m</span>`, s.tris > limitFor(info));
  });
}

function compare(ids) {
  const rows = ids.length;
  const ch = Math.floor(H / rows), cw = Math.floor(W / 3);
  ids.forEach((id, i) => {
    const obj = stageModel(id);
    scene.add(obj);
    const y = i * ch;
    const info = obj.userData.info;
    renderCell(obj, { x: 0, y, w: cw, h: ch, pad: 1.1 }, +(Q.get('yaw') ?? (info.view && info.view.yaw) ?? 28), +(Q.get('el') ?? (info.view && info.view.el) ?? ELEV[info.mount] ?? 20));
    const refs = [`../gauntlet/ref/devices/${id}.jpg`, `../gauntlet/ref/devices/${id}-2.jpg`];
    refs.forEach((src, k) => {
      const img = new Image();
      img.className = 'ref';
      Object.assign(img.style, { left: cw * (k + 1) + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' });
      img.onerror = () => { const d = document.createElement('div'); d.className = 'miss'; Object.assign(d.style, { left: cw * (k + 1) + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' }); d.textContent = 'brak zdjęcia'; img.replaceWith(d); };
      img.src = src;
      ui.appendChild(img);
    });
    if (Q.get('label') !== '0') addLabel(0, y, `<b>${id}</b>`);
  });
}

function hooksScene() {
  const U = 0.04445, MOD = 0.0175;
  const root = new THREE.Group();
  root.userData.id = 'scene';
  const panel = buildDevice('panel-enclosure', { rows: 2, slotsPerRow: 12 });
  const rows = [['main-switch', 'rcd', 'mcb-b16', 'mcb-b16', 'mcb-b16', 'mcb-b16', 'shelly-pro-4pm'], ['surge-t1t2', 'mcb-b10', 'mcb-b10', 'mcb-b10', 'mcb-c20', 'shelly-pro-2pm', 'shelly-pro-dimmer-2pm', 'shelly-pro-3em']];
  rows.forEach((ids, r) => {
    const rail = panel.userData.rails[r];
    let slot = 0;
    for (const id of ids) {
      const d = buildDevice(id);
      const n = d.userData.modules || 1;
      d.position.set(rail.x0 + (slot + n / 2) * MOD, rail.y, rail.z);
      if (id === 'mcb-b16' && slot === 5 && d.userData.lever) d.userData.lever.rotation.x = d.userData.lever.userData.off;
      panel.add(d);
      slot += n;
    }
  });
  panel.userData.door.rotation.y = panel.userData.door.userData.open;
  panel.position.set(-0.05, 1.2, 0);
  const rack = buildDevice('rack-12u');
  const o = rack.userData.rackOrigin;
  for (const [id, u] of [['ups-2u', 0], ['pdu-pro', 2], ['unvr', 4], ['rack-shelf', 5], ['udm-pro-max', 7], ['usw-pro-max-24-poe', 8], ['brush-panel', 9], ['patch-panel-24', 10], ['usw-pro-max-16-poe', 11]]) {
    const d = buildDevice(id);
    d.position.set(o[0], o[1] + u * U, o[2]);
    if (id === 'usw-pro-max-24-poe') d.userData.ports.forEach((p, i) => { if (p.led && i < 24 && i % 3 !== 2) { p.led.emissiveIntensity = 1.2; p.led.emissive.set(['#3d8bff', '#a35bff', '#21c8a8', '#ffb020'][i % 4]); } });
    if (id === 'rack-shelf') { const g = buildDevice('ucg-max'); g.position.set(...d.userData.shelf.origin); d.add(g); }
    rack.add(d);
  }
  rack.userData.door.rotation.y = rack.userData.door.userData.open;
  rack.position.set(0.62, 1.2, 0);
  const box = buildDevice('media-box');
  const sh = box.userData.shelf;
  const ucg = buildDevice('ucg-ultra'); ucg.position.set(sh.origin[0] - 0.09, sh.origin[1], sh.origin[2]); box.add(ucg);
  const fm = buildDevice('usw-flex-mini'); fm.position.set(sh.origin[0] + 0.1, sh.origin[1], sh.origin[2]); box.add(fm);
  const on = buildDevice('ont'); on.position.set(-0.1, 0.12, -0.14 + 0.0004); box.add(on);
  box.userData.door.rotation.y = box.userData.door.userData.open;
  box.position.set(-0.62, 1.2, 0);
  const wall = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 0.02), new THREE.MeshStandardMaterial({ color: '#e7e3dc', roughness: 0.9 }));
  wall.position.set(0, 1.2, -0.01 - 0.15);
  wall.receiveShadow = true;
  root.add(panel, rack, box, wall);
  scene.add(root);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 20);
  cam.position.set(0.25, 1.55, 2.6);
  cam.lookAt(0.0, 1.2, 0);
  const sph = new THREE.Sphere(new THREE.Vector3(0, 1.2, 0), 1.2);
  lightFor(sph);
  floor.visible = false;
  renderer.render(scene, cam);
}

async function main() {
  window.__ids = MODEL_IDS;
  window.__info = MODEL_INFO;
  if (Q.get('list')) { window.__ready = true; return; }
  if (Q.get('scene')) hooksScene();
  else if (Q.get('id')) single(Q.get('id'));
  else if (Q.get('compare')) compare(Q.get('compare').split(','));
  else grid(idList());
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.addEventListener('load', r); im.addEventListener('error', () => setTimeout(r, 0)); })));
  requestAnimationFrame(() => { window.__ready = true; });
}
main().catch((e) => { window.__error = String(e && e.stack || e); });
</script>
</body>
</html>
